<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <link rel="stylesheet" th:href="@{/css/classificacao.css}">
</head>

<body th:replace="~{layout :: template(titulo='Classificação', conteudo=~{classificacao :: content})}">

<div th:fragment="content" class="cl-wrapper">

    <div class="cl-header">
        <div>
            <h1 class="cl-title">Classificação Geral</h1>
            <p class="cl-sub">Ranking atualizado com base nos palpites pontuados.</p>
        </div>
    </div>

    <!-- VAZIO -->
    <div class="cl-empty" th:if="${#lists.isEmpty(ranking)}">
        <i class="bi bi-trophy"></i>
        <p>Nenhum palpite pontuado ainda. A classificação será exibida após a primeira rodada.</p>
    </div>

    <!-- RANKING -->
    <div class="cl-card" th:if="${not #lists.isEmpty(ranking)}">

        <!-- TOP 3 pódio -->
        <div class="cl-podio" th:if="${#lists.size(ranking) >= 1}">
            <!-- 2º lugar -->
            <div class="cl-podio-item podio-silver" th:if="${#lists.size(ranking) >= 2}">
                <div class="cl-podio-medal">🥈</div>
                <div class="cl-podio-avatar"
                     th:text="${#strings.toUpperCase(#strings.substring(ranking[1].usuario().nome, 0, 1) + #strings.substring(ranking[1].usuario().sobrenome, 0, 1))}">
                </div>
                <div class="cl-podio-nome" th:text="${ranking[1].usuario().nome}"></div>
                <div class="cl-podio-pts" th:text="${ranking[1].pontos} + ' pts'"></div>
            </div>

            <!-- 1º lugar -->
            <div class="cl-podio-item podio-gold">
                <div class="cl-podio-medal">🥇</div>
                <div class="cl-podio-avatar avatar-gold"
                     th:text="${#strings.toUpperCase(#strings.substring(ranking[0].usuario().nome, 0, 1) + #strings.substring(ranking[0].usuario().sobrenome, 0, 1))}">
                </div>
                <div class="cl-podio-nome" th:text="${ranking[0].usuario().nome}"></div>
                <div class="cl-podio-pts" th:text="${ranking[0].pontos} + ' pts'"></div>
            </div>

            <!-- 3º lugar -->
            <div class="cl-podio-item podio-bronze" th:if="${#lists.size(ranking) >= 3}">
                <div class="cl-podio-medal">🥉</div>
                <div class="cl-podio-avatar avatar-bronze"
                     th:text="${#strings.toUpperCase(#strings.substring(ranking[2].usuario().nome, 0, 1) + #strings.substring(ranking[2].usuario().sobrenome, 0, 1))}">
                </div>
                <div class="cl-podio-nome" th:text="${ranking[2].usuario().nome}"></div>
                <div class="cl-podio-pts" th:text="${ranking[2].pontos} + ' pts'"></div>
            </div>
        </div>

        <!-- TABELA COMPLETA -->
        <div class="cl-table-wrap">
            <table class="cl-table">
                <thead>
                    <tr>
                        <th class="col-pos">#</th>
                        <th>Participante</th>
                        <th class="col-num">Palpites</th>
                        <th class="col-num">Cravadas</th>
                        <th class="col-pts">Pontos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry, iter : ${ranking}"
                        th:classappend="${iter.index == 0} ? 'row-gold' : (${iter.index == 1} ? 'row-silver' : (${iter.index == 2} ? 'row-bronze' : ''))">

                        <!-- Posição -->
                        <td class="col-pos">
                            <span th:if="${iter.index == 0}" class="pos-medal">🥇</span>
                            <span th:if="${iter.index == 1}" class="pos-medal">🥈</span>
                            <span th:if="${iter.index == 2}" class="pos-medal">🥉</span>
                            <span th:if="${iter.index > 2}"  class="pos-num" th:text="${iter.index + 1}"></span>
                        </td>

                        <!-- Nome + avatar -->
                        <td>
                            <div class="cl-user">
                                <div class="cl-avatar"
                                     th:classappend="${iter.index == 0} ? 'cl-avatar-gold' : (${iter.index == 1} ? 'cl-avatar-silver' : (${iter.index == 2} ? 'cl-avatar-bronze' : ''))"
                                     th:text="${#strings.toUpperCase(#strings.substring(entry.usuario().nome, 0, 1) + #strings.substring(entry.usuario().sobrenome, 0, 1))}">
                                </div>
                                <span class="cl-nome" th:text="${entry.usuario().nome + ' ' + entry.usuario().sobrenome}"></span>
                            </div>
                        </td>

                        <!-- Palpites feitos -->
                        <td class="col-num cl-num" th:text="${entry.palpitesFeitos()}"></td>

                        <!-- Placares exatos -->
                        <td class="col-num cl-num" th:text="${entry.placaresExatos()}"></td>

                        <!-- Pontos -->
                        <td class="col-pts">
                            <span class="cl-pts" th:text="${entry.pontos()}"></span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

</div>

</body>
</html>
