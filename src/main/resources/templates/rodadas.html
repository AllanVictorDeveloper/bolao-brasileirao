<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/rodadas.css}">
</head>

<body th:replace="~{layout :: template(titulo=${titulo}, conteudo=~{rodadas :: content})}">

<div th:fragment="content" class="rodadas-wrapper">

    <!-- CABEÇALHO -->
    <div class="rodada-header">
        <a th:if="${hasAnterior}" th:href="@{/rodadas(rodada=${rodada - 1})}" class="nav-btn btn-link">&lt;</a>
        <span th:if="${!hasAnterior}" class="nav-btn nav-disabled">&lt;</span>

        <h2 th:text="${rodada} + 'ª RODADA'"></h2>

        <a th:if="${hasProxima}" th:href="@{/rodadas(rodada=${rodada + 1})}" class="nav-btn btn-link">&gt;</a>
        <span th:if="${!hasProxima}" class="nav-btn nav-disabled">&gt;</span>
    </div>

    <!-- AVISO -->
    <div class="aviso-rodada fade-in" th:if="${semJogos}">
        <p>Rodada ainda não está disponível.</p>
    </div>

    <!-- LISTAGEM DE JOGOS -->
    <div class="jogo-item"
         th:each="jogo : ${jogos}"
         th:classappend="${jogo.status.name().toLowerCase()}">

        <!-- LOCAL -->
        <div class="jogo-info-topo">
            <span class="estadio" th:text="${jogo.estadio}">CASTELÃO (CE)</span>
        </div>

        <!-- SELO DE STATUS (lado esquerdo superior) -->
        <div class="status-selo"
             th:classappend="${jogo.status.name().toLowerCase()}">
    <span th:text="${
        jogo.status.name() == 'FINALIZADO' ? 'ENCERRADO' :
        (jogo.status.name() == 'AGENDADO' ? 'AGENDADO' : 'EM ANDAMENTO')
    }"></span>
        </div>

        <!-- CONTEÚDO CENTRAL -->
        <div class="jogo-content">

            <!-- TIME MANDANTE -->
            <div class="time">
                <img class="escudo"
                     th:src="@{${jogo.mandanteEscudo}}"
                     alt="escudo mandante">
                <span class="sigla" th:text="${jogo.mandanteSigla}">CEA</span>
            </div>

            <!-- PLACAR -->
            <div class="placar-area">
                <span class="placar" th:if="${jogo.placarMandante != null}"
                      th:text="${jogo.placarMandante + ' × ' + jogo.placarVisitante}">2 × 0</span>

                <span class="placar" th:if="${jogo.placarMandante == null}">
                    - × -
                </span>
            </div>

            <!-- TIME VISITANTE -->
            <div class="time">
                <img class="escudo"
                     th:src="@{${jogo.visitanteEscudo}}"
                     alt="escudo visitante">
                <span class="sigla" th:text="${jogo.visitanteSigla}">SPO</span>
            </div>
        </div>

        <!-- DATA -->
        <div class="jogo-info-bottom">
            <span class="data"
                  th:text="${#temporals.format(jogo.dataJogo, 'EEE, dd/MM • HH:mm')}">
            </span>
        </div>

    </div>

</div>

</body>
</html>
