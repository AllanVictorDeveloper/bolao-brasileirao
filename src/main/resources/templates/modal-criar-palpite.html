<div class="modal-overlay" id="modalPalpite" th:fragment="modalPalpite">
    <div class="modal-content">

        <h2 th:text="'Palpite da Rodada ' + ${jogo.rodada} + 'ª'"></h2>
        <p th:text="${jogo.mandanteSigla} + ' x ' + ${jogo.visitanteSigla}"></p>

        <form method="post" th:action="@{/palpite/salvar}">
            <input type="hidden" name="jogoId" th:value="${jogo.id}">
            <input type="hidden" name="rodada" th:value="${jogo.rodada}">

            <!-- PLACAR -->
            <div class="placar-inputs">
                <div>
                    <label>Mandante:</label>
                    <input type="number" min="0" name="placarMandante" required>
                </div>

                <div class="x">×</div>

                <div>
                    <label>Visitante:</label>
                    <input type="number" min="0" name="placarVisitante" required>
                </div>
            </div>

            <!-- ARTILHEIRO -->
            <div class="form-group">
                <label>Artilheiro:</label>
                <select name="artilheiroId" required>
                    <option value="" disabled selected>Selecione</option>
                    <optgroup th:label="${jogo.mandante}" th:if="${not #lists.isEmpty(artilheirosMandante)}">
                        <option th:each="a : ${artilheirosMandante}"
                                th:value="${a.atletaId}"
                                th:text="${a.nome}">
                        </option>
                    </optgroup>
                    <optgroup th:label="${jogo.visitante}" th:if="${not #lists.isEmpty(artilheirosVisitante)}">
                        <option th:each="a : ${artilheirosVisitante}"
                                th:value="${a.atletaId}"
                                th:text="${a.nome}">
                        </option>
                    </optgroup>
                </select>
            </div>

            <!-- PAREDÃO -->
            <div class="form-group">
                <label>Paredão (Goleiro):</label>
                <select name="paredaoId" required>
                    <option value="" disabled selected>Selecione</option>
                    <optgroup th:label="${jogo.mandante}" th:if="${not #lists.isEmpty(goleirosMandante)}">
                        <option th:each="g : ${goleirosMandante}"
                                th:value="${g.atletaId}"
                                th:text="${g.nome}">
                        </option>
                    </optgroup>
                    <optgroup th:label="${jogo.visitante}" th:if="${not #lists.isEmpty(goleirosVisitante)}">
                        <option th:each="g : ${goleirosVisitante}"
                                th:value="${g.atletaId}"
                                th:text="${g.nome}">
                        </option>
                    </optgroup>
                </select>
            </div>

            <!-- TÉCNICO -->
            <div class="form-group">
                <label>Técnico:</label>
                <select name="tecnicoId" required>
                    <option value="" disabled selected>Selecione</option>
                    <optgroup th:label="${jogo.mandante}" th:if="${not #lists.isEmpty(tecnicosMandante)}">
                        <option th:each="t : ${tecnicosMandante}"
                                th:value="${t.atletaId}"
                                th:text="${t.nome}">
                        </option>
                    </optgroup>
                    <optgroup th:label="${jogo.visitante}" th:if="${not #lists.isEmpty(tecnicosVisitante)}">
                        <option th:each="t : ${tecnicosVisitante}"
                                th:value="${t.atletaId}"
                                th:text="${t.nome}">
                        </option>
                    </optgroup>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" onclick="fecharModal()">Cancelar</button>
                <button type="submit" class="salvar">Salvar Palpite</button>
            </div>

        </form>

    </div>
</div>
