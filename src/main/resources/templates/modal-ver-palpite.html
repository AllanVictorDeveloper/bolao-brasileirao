<div class="modal-overlay" id="modalVerPalpite" th:fragment="modalVerPalpite">
    <div class="modal-card">

        <!-- HEADER -->
        <div class="mc-header">
            <div class="mc-meta">
                <span class="mc-rodada" th:text="${jogo.rodada} + 'ª Rodada'"></span>
                <span class="mc-data" th:text="${#temporals.format(jogo.dataJogo, 'EEE, dd/MM • HH:mm')}"></span>
            </div>
            <button class="mc-close" type="button" onclick="fecharModalVer()">&#x2715;</button>
        </div>

        <!-- PLACAR PALPITADO -->
        <div class="mc-placar-section">
            <div class="mc-time">
                <img class="mc-escudo" th:src="${jogo.mandanteEscudo}" alt="mandante">
                <span class="mc-sigla" th:text="${jogo.mandanteSigla}"></span>
                <div class="mc-gol-display" th:text="${palpite.golsCasaPalpite}">0</div>
            </div>

            <div class="mc-vs-col">
                <span class="mc-vs">×</span>
                <span class="mc-ver-label">Seu palpite</span>
            </div>

            <div class="mc-time">
                <img class="mc-escudo" th:src="${jogo.visitanteEscudo}" alt="visitante">
                <span class="mc-sigla" th:text="${jogo.visitanteSigla}"></span>
                <div class="mc-gol-display" th:text="${palpite.golsForaPalpite}">0</div>
            </div>
        </div>

        <!-- PLACAR REAL (só se finalizado) -->
        <div class="mc-placar-real" th:if="${jogo.placarMandante != null}">
            <span class="mc-placar-real-label">Placar final</span>
            <span class="mc-placar-real-val"
                  th:text="${jogo.placarMandante} + ' × ' + ${jogo.placarVisitante}"></span>
        </div>

        <!-- ESCOLHAS -->
        <div class="mc-fields">

            <div class="mc-ver-row">
                <span class="mc-label"><span class="mc-icon">&#9917;</span> Artilheiro</span>
                <span class="mc-ver-val" th:text="${nomeArtilheiro}">-</span>
            </div>

            <div class="mc-ver-row">
                <span class="mc-label"><span class="mc-icon">🧤</span> Paredão</span>
                <span class="mc-ver-val" th:text="${nomeParedao}">-</span>
            </div>

            <div class="mc-ver-row">
                <span class="mc-label"><span class="mc-icon">🎽</span> Técnico</span>
                <span class="mc-ver-val" th:text="${nomeTecnico}">-</span>
            </div>

        </div>

        <!-- PONTOS (só se finalizado) -->
        <div class="mc-pontos" th:if="${palpite.pontos != null}">
            <span class="mc-pontos-num" th:text="${palpite.pontos}">0</span>
            <span class="mc-pontos-label">pontos</span>
        </div>

        <!-- ACTIONS -->
        <div class="mc-actions">
            <button class="mc-btn-save" type="button" onclick="fecharModalVer()">Fechar</button>
        </div>

    </div>
</div>
